<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Edebiyatı Mekân ve Rota Atlası | TÜBİTAK 2209-A</title>
    <!-- Leaflet Harita Kütüphanesi CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0b0b0d;
            --panel-bg: rgba(28, 28, 30, 0.75);
            --card-bg: rgba(44, 44, 46, 0.6);
            --card-hover: rgba(58, 58, 60, 0.8);
            --accent-color: #f59e0b; /* Apple Altın/Kehribar */
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            position: relative; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Apple Sıvı Cam (Glassmorphism) Sol Panel */
        #sidebar { 
            width: 400px; 
            background: var(--panel-bg); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glass); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }
        .sidebar-header { 
            padding: 24px; 
            border-bottom: 1px solid var(--border-glass); 
            background: rgba(28, 28, 30, 0.4); 
        }
        .sidebar-header h1 { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.01em; }
        .sidebar-header p { font-size: 0.85rem; color: var(--accent-color); font-weight: 500; }
        
        .work-list { overflow-y: auto; flex: 1; padding: 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
        .work-list::-webkit-scrollbar { width: 6px; }
        .work-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Apple Yumuşak Dokulu Kartlar (Tactile Cards) */
        .work-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .work-card:hover { 
            background: var(--card-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .work-card h3 { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .work-card .author { font-size: 0.85rem; color: var(--accent-color); font-style: italic; margin-bottom: 8px; font-weight: 400; }
        .work-card .location { font-size: 0.75rem; color: var(--text-secondary); background: rgba(0,0,0,0.3); display: inline-block; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; font-weight: 500; border: 1px solid var(--border-glass); }
        .work-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 12px; margin: 6px 0 10px 0; display: block; border: 1px solid var(--border-glass); }
        .work-card p { font-size: 0.85rem; color: #d4d4d8; line-height: 1.5; border-top: 1px solid var(--border-glass); padding-top: 10px; }

        /* Harita Alanı */
        #map { flex: 1; height: 100%; background-color: #0b0b0d; }
        
        /* Harita Popup Özelleştirmesi (Apple Tarzı) */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(28, 28, 30, 0.9) !important;
            backdrop-filter: blur(20px) !important;
            color: #fff !important;
            border-radius: 16px !important;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-content img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin: 8px 0; display: block; }

        /* Sağ Üst Oval Hap (Pill) Şeklinde Dil Butonu */
        #lang-container { position: absolute; top: 20px; right: 24px; z-index: 2000; }
        #lang-btn { 
            background: rgba(28, 28, 30, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary); 
            border: 1px solid var(--border-glass); 
            padding: 8px 18px; 
            height: 42px; 
            border-radius: 21px; /* Oval / Hap biçimi */
            cursor: pointer; 
            font-size: 0.9rem; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        #lang-btn:hover { transform: scale(1.05); background: rgba(58, 58, 60, 0.9); border-color: var(--accent-color); }
        #lang-menu { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 52px; 
            background: rgba(28, 28, 30, 0.9); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 140px; 
            padding: 6px;
        }
        #lang-menu.show { display: block; animation: fadeIn 0.2s ease; }
        .lang-option { 
            padding: 10px 14px; 
            color: var(--text-primary); 
            background: none; 
            border: none; 
            width: 100%; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.9rem; 
            border-radius: 8px;
            transition: background 0.15s;
            font-weight: 500;
        }
        .lang-option:hover { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 45vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Sağ Üst Oval Dil Butonu -->
    <div id="lang-container">
        <button id="lang-btn" onclick="toggleLangMenu()">🌐 Dil / Lang</button>
        <div id="lang-menu">
            <button class="lang-option" onclick="setLanguage('tr')">🇹🇷 Türkçe</button>
            <button class="lang-option" onclick="setLanguage('en')">🇬🇧 English</button>
            <button class="lang-option" onclick="setLanguage('fr')">🇫🇷 Français</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1 id="ui-title">Türk Edebiyatı Atlası</h1>
            <p id="ui-subtitle">TÜBİTAK 2209-A Projesi</p>
        </div>
        <div class="work-list" id="workList"></div>
    </div>

    <div id="map"></div>

    <!-- Leaflet Harita Kütüphanesi JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const uiTexts = {
            tr: { title: "Türk Edebiyatı Atlası", subtitle: "TÜBİTAK 2209-A Projesi", loc: "Mekân:" },
            en: { title: "Turkish Literature Atlas", subtitle: "TUBITAK 2209-A Project", loc: "Location:" },
            fr: { title: "Atlas de Littérature Turque", subtitle: "Projet TUBITAK 2209-A", loc: "Lieu:" }
        };

        const literaryData = [
            {
                id: 1,
                title: { tr: "Çalıkuşu", en: "The Wren", fr: "L'Oiselle" },
                author: { tr: "Reşat Nuri Güntekin", en: "Reşat Nuri Güntekin", fr: "Reşat Nuri Güntekin" },
                locationName: { tr: "Zeyniler Köyü (Bursa)", en: "Zeyniler Village (Bursa)", fr: "Village de Zeyniler (Bursa)" },
                lat: 40.1885,
                lng: 29.0610,
                emoji: "🌳",
                quote: {
                    tr: "Zeyniler köyü, dağ başından aşağıya doğru inen virajlı bir yokuşun bitiminde, etrafı ceviz ağaçlarıyla çevrili sessiz bir yerdi.",
                    en: "Zeyniler village was a quiet place surrounded by walnut trees at the end of a winding slope coming down from the mountain.",
                    fr: "Le village de Zeyniler était un endroit calme entouré de noyers au bout d'une pente sinueuse descendant de la montagne."
                },
                image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=800"
            },
            {
                id: 2,
                title: { tr: "Yaban", en: "The Alien / The Stranger", fr: "L'Étranger (Yaban)" },
                author: { tr: "Yakup Kadri Karaosmanoğlu", en: "Yakup Kadri Karaosmanoğlu", fr: "Yakup Kadri Karaosmanoğlu" },
                locationName: { tr: "Porsuk Çayı Kenarı (Eskişehir)", en: "Porsuk Stream Bank (Eskişehir)", fr: "Rive de la rivière Porsuk (Eskişehir)" },
                lat: 39.4447,
                lng: 31.5369,
                emoji: "💧",
                quote: {
                    tr: "Bu köylüler, aydın kişinin uzattığı eli ısıracak kadar yaban ve yalnız bırakılmışlardı.",
                    en: "These villagers had been left so wild and alone that they would bite the hand extended by the intellectual.",
                    fr: "Ces villageois avaient été laissés si sauvages et seuls qu'ils mordaient la main tendue par l'intellectuel."
                },
                image: "https://images.unsplash.com/photo-1518684079-3c830dcef090?w=800"
            },
            {
                id: 3,
                title: { tr: "Saatleri Ayarlama Enstitüsü", en: "The Time Regulation Institute", fr: "L'Institut de Régulation des Heures" },
                author: { tr: "Ahmet Hamdi Tanpınar", en: "Ahmet Hamdi Tanpınar", fr: "Ahmet Hamdi Tanpınar" },
                locationName: { tr: "Şehzadebaşı (İstanbul)", en: "Şehzadebaşı (Istanbul)", fr: "Şehzadebaşı (Istanbul)" },
                lat: 41.0082,
                lng: 28.9784,
                emoji: "⏰",
                quote: {
                    tr: "Şehzadebaşı'nın o eski, huzurlu ramazan akşamlarında saat sesleri insanı zamanın dışına taşıardı.",
                    en: "In those old, peaceful Ramadan evenings of Şehzadebaşı, the sounds of clocks carried a person outside of time.",
                    fr: "En ces vieux et paisibles soirs de Ramadan à Şehzadebaşı, le son des horloges transportait l'homme hors du temps."
                },
                image: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?w=800"
            },
            {
                id: 4,
                title: { tr: "İnce Memed", en: "Memed, My Hawk", fr: "Memed le Migre" },
                author: { tr: "Yaşar Kemal", en: "Yaşar Kemal", fr: "Yaşar Kemal" },
                locationName: { tr: "Çukurova / Toroslar (Adana)", en: "Çukurova / Taurus Mts (Adana)", fr: "Çukurova / Monts Taurus (Adana)" },
                lat: 37.0000,
                lng: 35.3213,
                emoji: "☀️",
                quote: {
                    tr: "Çukurova yanıyor, demir gibi kızıyordu. Toroslar'ın ardında ise bambaşka bir dünya esiyordu.",
                    en: "Çukurova was burning, glowing like iron. Behind the Taurus Mountains, a completely different world was blowing.",
                    fr: "Çukurova brûlait, rougeoyant comme du fer. Derrière les monts Taurus soufflait un monde complètement différent."
                },
                image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800"
            },
            {
                id: 5,
                title: { tr: "Seyahatname", en: "Book of Travels", fr: "Livre des Voyages" },
                author: { tr: "Evliya Çelebi", en: "Evliya Çelebi", fr: "Evliya Çelebi" },
                locationName: { tr: "Selimiye Camii (Edirne)", en: "Selimiye Mosque (Edirne)", fr: "Mosquée Selimiye (Edirne)" },
                lat: 41.6771,
                lng: 26.5557,
                emoji: "🕌",
                quote: {
                    tr: "Edirne şehri rûy-i zemin cennetinden bir köşedir. Mimar Sinan'ın kalfalık eserim dediği Selimiye cihanın göz bebeğidir.",
                    en: "The city of Edirne is a corner from the paradise of the earth. Selimiye, which Mimar Sinan called his journeyman piece, is the apple of the world's eye.",
                    fr: "La ville d'Edirne est un coin du paradis terrestre. Selimiye, que Mimar Sinan appelait son œuvre de compagnon, est la prunelle des yeux du monde."
                },
                image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800"
            }
        ];

        let currentLang = 'tr';

        const map = L.map('map', { zoomControl: false }).setView([39.1667, 35.3333], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = {};

        function toggleLangMenu() {
            document.getElementById('lang-menu').classList.toggle('show');
        }

        window.addEventListener('click', function(e) {
            if (!document.getElementById('lang-container').contains(e.target)) {
                document.getElementById('lang-menu').classList.remove('show');
            }
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-menu').classList.remove('show');
            renderApp();
        }

        function renderApp() {
            document.getElementById('ui-title').innerText = uiTexts[currentLang].title;
            document.getElementById('ui-subtitle').innerText = uiTexts[currentLang].subtitle;

            const workListContainer = document.getElementById('workList');
            workListContainer.innerHTML = '';

            for (let id in markersLayer) {
                map.removeLayer(markersLayer[id]);
            }
            markersLayer = {};

            literaryData.forEach(function(item) {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML = '<h3>' + item.title[currentLang] + '</h3>' +
                                 '<div class="author">' + item.author[currentLang] + '</div>' +
                                 '<div class="location">📍 ' + item.locationName[currentLang] + '</div>' +
                                 '<img src="' + item.image + '" alt="' + item.title[currentLang] + '">' +
                                 '<p>"' + item.quote[currentLang] + '"</p>';

                // Özel Emoji Pin Tasarımı (Sıvı Cam Estetiğinde)
                const emojiIcon = L.divIcon({
                    className: 'custom-emoji-pin',
                    html: '<div style="background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1.5px solid rgba(245, 158, 11, 0.5); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s;">' + item.emoji + '</div>',
                    iconSize: [42, 42],
                    iconAnchor: [21, 21],
                    popupAnchor: [0, -24]
                });

                const marker = L.marker([item.lat, item.lng], { icon: emojiIcon }).addTo(map);
                marker.bindPopup('<b>' + item.title[currentLang] + '</b><br><em>' + item.author[currentLang] + '</em><br><b>' + uiTexts[currentLang].loc + '</b> ' + item.locationName[currentLang] + '<br><img src="' + item.image + '" alt="' + item.title[currentLang] + '"><br>"' + item.quote[currentLang] + '"');

                markersLayer[item.id] = marker;

                card.addEventListener('click', function() {
                    map.setView([item.lat, item.lng], 10, { animate: true, duration: 1 });
                    marker.openPopup();
                });

                workListContainer.appendChild(card);
            });
        }

        renderApp();
    </script>
</body>
</html>
