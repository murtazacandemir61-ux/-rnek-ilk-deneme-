<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Edebiyatı Mekân ve Rota Atlası | TÜBİTAK 2209-A</title>
    <!-- Leaflet Harita Kütüphanesi CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #d4af37; /* Altın Sarısı */
            --text-color: #e4e4e7;
            --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sol Menü Paneli */
        #sidebar { width: 380px; background-color: var(--panel-bg); border-right: 1px solid #27272a; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #27272a; background: linear-gradient(135deg, #1a1a1e, #27272a); }
        .sidebar-header h1 { font-size: 1.2rem; color: var(--accent-color); margin-bottom: 5px; }
        .sidebar-header p { font-size: 0.85rem; color: var(--text-muted); }
        
        .work-list { overflow-y: auto; flex: 1; padding: 15px; }
        .work-card { background-color: #27272a; border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s ease; border-left: 4px solid var(--accent-color); }
        .work-card:hover { transform: translateY(-2px); background-color: #3f3f46; }
        .work-card h3 { font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .work-card .author { font-size: 0.85rem; color: var(--accent-color); font-style: italic; margin-bottom: 8px; }
        .work-card .location { font-size: 0.8rem; color: var(--text-muted); background: #18181b; display: inline-block; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; }
        .work-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; margin: 8px 0; border: 1px solid #3f3f46; }
        .work-card p { font-size: 0.85rem; color: #d4d4d8; line-height: 1.4; border-top: 1px solid #3f3f46; padding-top: 8px; }

        /* Harita Alanı ve Popup Görselleri */
        #map { flex: 1; height: 100%; background-color: #18181b; }
        .leaflet-popup-content img { width: 100%; max-height: 140px; object-fit: cover; border-radius: 6px; margin: 6px 0; }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 45vh; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Sol Eserler Paneli -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>Türk Edebiyatı Atlası</h1>
            <p>TÜBİTAK 2209-A Dijital Beşeri Bilimler Projesi</p>
        </div>
        <div class="work-list" id="workList">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </div>

    <!-- Harita Alanı -->
    <div id="map"></div>

    <!-- Leaflet Harita Kütüphanesi JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Her Eserin Kendi Görseliyle Tanımlandığı Veri Tabanı
        const literaryData = [
            {
                id: 1,
                title: "Çalıkuşu",
                author: "Reşat Nuri Güntekin",
                locationName: "Zeyniler Köyü (Bursa)",
                lat: 40.1885,
                lng: 29.0610,
                quote: "Zeyniler köyü, dağ başından aşağıya doğru inen virajlı bir yokuşun bitiminde, etrafı ceviz ağaçlarıyla çevrili sessiz bir yerdi.",
                image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=800"
            },
            {
                id: 2,
                title: "Yaban",
                author: "Yakup Kadri Karaosmanoğlu",
                locationName: "Porsuk Çayı Kenarı (Eskişehir)",
                lat: 39.4447,
                lng: 31.5369,
                quote: "Bu köylüler, aydın kişinin uzattığı eli ısıracak kadar yaban ve yalnız bırakılmışlardı; Porsuk çayı hep aynı hüzünle akıyordu.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Porsuk_Çayı_Eskişehir_2.jpg/800px-Porsuk_Çayı_Eskişehir_2.jpg"
            },
            {
                id: 3,
                title: "Saatleri Ayarlama Enstitüsü",
                author: "Ahmet Hamdi Tanpınar",
                locationName: "Şehzadebaşı / Beyazıt (İstanbul)",
                lat: 41.0082,
                lng: 28.9784,
                quote: "Şehzadebaşı'nın o eski, huzurlu ramazan akşamlarında saat sesleri insanı zamanın dışına taşıardı.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Istanbul_asv2020-02_img_isuv_0427.jpg/800px-Istanbul_asv2020-02_img_isuv_0427.jpg"
            },
            {
                id: 4,
                title: "İnce Memed",
                author: "Yaşar Kemal",
                locationName: "Çukurova / Toroslar (Adana)",
                lat: 37.0000,
                lng: 35.3213,
                quote: "Çukurova yanıyor, demir gibi kızıyordu. Toroslar'ın ardında ise bambaşka bir dünya, asi bir rüzgar esiyordu.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Toros_Dağları_01.jpg/800px-Toros_Dağları_01.jpg"
            },
            {
                id: 5,
                title: "Seyahatname",
                author: "Evliya Çelebi",
                locationName: "Selimiye Camii (Edirne)",
                lat: 41.6771,
                lng: 26.5557,
                quote: "Edirne şehri rûy-i zemin cennetinden bir köşedir. Mimar Sinan'ın kalfalık eserim dediği Selimiye cihanın göz bebeğidir.",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Selimiye_Mosque_Edirne_2009.jpg/800px-Selimiye_Mosque_Edirne_2009.jpg"
            }
        ];

        // Haritayı Başlat (Türkiye Odaklı)
        const map = L.map('map').setView([39.1667, 35.3333], 6);

        // Standart, Kesintisiz ve %100 Ücretsiz OpenStreetMap Katmanı
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        const markers = {};
        const workListContainer = document.getElementById('workList');

        // Eserleri Listele ve Haritaya Pin Ekle
        literaryData.forEach(item => {
            // Sol menü için kart oluştur
            const card = document.createElement('div');
            card.className = 'work-card';
            card.innerHTML = `
                <h3>${item.title}</h3>
                <div class="author">${item.author}</div>
                <div class="location">📍 ${item.locationName}</div>
                <img src="${item.image}" alt="${item.title}">
                <p>"${item.quote}"</p>
            `;

            // Harita üzerine pin ve popup ekle
            const marker = L.marker([item.lat, item.lng]).addTo(map);
            marker.bindPopup(`
                <b>${item.title}</b><br>
                <em>${item.author}</em><br>
                <b>Mekân:</b> ${item.locationName}<br>
                <img src="${item.image}" alt="${item.title}"><br>
                "${item.quote}"
            `);

            markers[item.id] = marker;

            // Karta tıklandığında haritayı oine odakla ve popup aç
            card.addEventListener('click', () => {
                map.setView([item.lat, item.lng], 10);
                marker.openPopup();
            });

            workListContainer.appendChild(card);
        });
    </script>
</body>
</html>
