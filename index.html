<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türk Edebiyatı Mekân ve Rota Atlası</title>
    <!-- Leaflet Harita Kütüphanesi CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0b0b0d;
            --panel-bg: rgba(28, 28, 30, 0.75);
            --card-bg: rgba(44, 44, 46, 0.6);
            --card-hover: rgba(58, 58, 60, 0.8);
            --accent-color: #f59e0b; /* Apple Altın/Kehribar */
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: relative; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Sol Panel */
        #sidebar { 
            width: 400px; 
            min-width: 400px;
            background: var(--panel-bg); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glass); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }
        .sidebar-header { 
            padding: 24px; 
            border-bottom: 1px solid var(--border-glass); 
            background: rgba(28, 28, 30, 0.4); 
        }
        .sidebar-header h1 { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
        
        .work-list { overflow-y: auto; flex: 1; padding: 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
        .work-list::-webkit-scrollbar { width: 6px; }
        .work-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Kartlar */
        .work-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .work-card:hover { 
            background: var(--card-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .work-card h3 { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .work-card .author { font-size: 0.85rem; color: var(--accent-color); font-style: italic; margin-bottom: 8px; font-weight: 400; }
        .work-card .location { font-size: 0.75rem; color: var(--text-secondary); background: rgba(0,0,0,0.3); display: inline-block; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; font-weight: 500; border: 1px solid var(--border-glass); }
        .work-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 12px; margin: 6px 0 10px 0; display: block; border: 1px solid var(--border-glass); }
        .work-card p { font-size: 0.85rem; color: #d4d4d8; line-height: 1.5; border-top: 1px solid var(--border-glass); padding-top: 10px; }

        /* Harita Alanı */
        #map { flex-grow: 1; height: 100%; width: 100%; background-color: #0b0b0d; position: relative; }
        
        /* Özel Apple Popup ve Kapatma Butonu Tasarımı */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(28, 28, 30, 0.95) !important;
            backdrop-filter: blur(25px) !important;
            color: #fff !important;
            border-radius: 16px !important;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6) !important;
        }
        .leaflet-popup-content img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin: 8px 0; display: block; }
        .leaflet-container a.leaflet-popup-close-button {
            background: rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 24px !important;
            height: 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            top: 12px !important;
            right: 12px !important;
            font-size: 14px !important;
            font-weight: bold;
            transition: background 0.2s;
        }
        .leaflet-container a.leaflet-popup-close-button:hover {
            background: rgba(245, 158, 11, 0.8) !important;
        }

        /* Sağ Üst Kontroller (Dil ve Harita Modülü) */
        .top-controls { position: absolute; top: 20px; right: 24px; z-index: 2000; display: flex; gap: 12px; }
        
        .pill-btn { 
            background: rgba(28, 28, 30, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary); 
            border: 1px solid var(--border-glass); 
            padding: 8px 18px; 
            height: 42px; 
            border-radius: 21px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        .pill-btn:hover { transform: scale(1.05); background: rgba(58, 58, 60, 0.9); border-color: var(--accent-color); }
        
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 52px; 
            background: rgba(28, 28, 30, 0.95); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            overflow-y: auto; 
            max-height: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            width: 170px; 
            padding: 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .dropdown-menu::-webkit-scrollbar { width: 5px; }
        .dropdown-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .dropdown-menu.show { display: block; animation: fadeIn 0.2s ease; }
        
        .dropdown-option { 
            padding: 9px 12px; 
            color: var(--text-primary); 
            background: none; 
            border: none; 
            width: 100%; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.85rem; 
            border-radius: 8px;
            transition: background 0.15s;
            font-weight: 500;
        }
        .dropdown-option:hover { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; min-width: 100%; height: 45vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
            #map { height: 55vh; }
        }
    </style>
</head>

        <div style="position: relative;">

            <div id="map-menu" class="dropdown-menu">

                <button class="dropdown-option" onclick="setMapStyle('satellite')">🛰️ Uydu Görünümü</button>
            </div>
        </div>

        <!-- Dil Seçici Butonu -->
        <div style="position: relative;" id="lang-container">
            <button class="pill-btn" onclick="toggleLangMenu()">🌐 Dil / Lang</button>

        let currentLang = 'tr';

        // Harita Sınırları ve Optimizasyonu (minZoom: 6 ile Türkiye'den fazla uzaklaşılamaz)
        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 6,
            maxZoom: 16,
            fadeAnimation: true,
            zoomAnimation: true
        }).setView([39.1667, 35.3333], 6);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Katman Tanımları
        const layers = {
            standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, keepBuffer: 8, attribution: '&copy; OpenStreetMap' }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, keepBuffer: 8, attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap' }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, keepBuffer: 8, attribution: 'Tiles &copy; Esri' })
        };

        let currentLayer = layers.standard.addTo(map);
        let markersLayer = {};

        // Menü Kontrolleri
        function toggleLangMenu() {
            document.getElementById('lang-menu').classList.toggle('show');
            document.getElementById('map-menu').classList.remove('show');
        }

        function toggleMapMenu() {
            document.getElementById('map-menu').classList.toggle('show');
            document.getElementById('lang-menu').classList.remove('show');
        }

        window.addEventListener('click', function(e) {
            if (!document.getElementById('lang-container').contains(e.target)) {
                document.getElementById('lang-menu').classList.remove('show');
            }
            if (!e.target.closest('#map-mode-btn') && !e.target.closest('#map-menu')) {
                document.getElementById('map-menu').classList.remove('show');
            }
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-menu').classList.remove('show');
            renderApp();
        }

        function setMapStyle(styleKey) {
            map.removeLayer(currentLayer);
            currentLayer = layers[styleKey].addTo(map);
            document.getElementById('map-menu').classList.remove('show');
        }

        function renderApp() {
            document.getElementById('ui-title').innerText = uiTexts[currentLang].title;

            const workListContainer = document.getElementById('workList');
            workListContainer.innerHTML = '';

            for (let id in markersLayer) {
                map.removeLayer(markersLayer[id]);
            }
            markersLayer = {};

            literaryData.forEach(function(item) {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML = '<h3>' + item.title[currentLang] + '</h3>' +
                                 '<div class="author">' + item.author[currentLang] + '</div>' +
                                 '<div class="location">📍 ' + item.locationName[currentLang] + '</div>' +
                                 '<img src="' + item.image + '" alt="' + item.title[currentLang] + '">' +
                                 '<p>"' + item.quote[currentLang] + '"</p>';

                const emojiIcon = L.divIcon({
                    className: 'custom-emoji-pin',
                    html: '<div style="background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1.5px solid rgba(245, 158, 11, 0.5); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s;">' + item.emoji + '</div>',
                    iconSize: [42, 42],
                    iconAnchor: [21, 21],
                    popupAnchor: [0, -24]
                });

                const marker = L.marker([item.lat, item.lng], { icon: emojiIcon }).addTo(map);
                marker.bindPopup('<b>' + item.title[currentLang] + '</b><br><em>' + item.author[currentLang] + '</em><br><b>' + uiTexts[currentLang].loc + '</b> ' + item.locationName[currentLang] + '<br><img src="' + item.image + '" alt="' + item.title[currentLang] + '"><br>"' + item.quote[currentLang] + '"');

                markersLayer[item.id] = marker;

                card.addEventListener('click', function() {
                    map.setView([item.lat, item.lng], 10, { animate: true, duration: 1 });
                    marker.openPopup();
                });

                workListContainer.appendChild(card);
            });
            
            setTimeout(function() { map.invalidateSize(); }, 200);
        }

        renderApp();
    </script>
