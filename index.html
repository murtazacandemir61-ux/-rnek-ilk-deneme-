<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasik Türk Edebiyatı Coğrafi Rota ve Eser Atlası</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet Harita Kütüphanesi CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0b0b0d;
            --panel-bg: rgba(28, 28, 30, 0.85);
            --card-bg: rgba(44, 44, 46, 0.6);
            --card-hover: rgba(58, 58, 60, 0.85);
            --accent-color: #f59e0b; /* Apple Altın/Kehribar */
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.1);
            --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --app-weight: 400;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--app-font); 
            font-weight: var(--app-weight);
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: relative; 
        }
        
        iframe[src*="netlify"], #netlify-badge, .netlify-badge, a[href*="netlify.com"] { 
            display: none !important; 
            visibility: hidden !important; 
            opacity: 0 !important; 
            pointer-events: none !important; 
        }

        /* Sol Panel */
        #sidebar { 
            width: 420px; 
            min-width: 420px;
            background: var(--panel-bg); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glass); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.6);
        }
        .sidebar-header { 
            padding: 22px 24px; 
            border-bottom: 1px solid var(--border-glass); 
            background: rgba(28, 28, 30, 0.5); 
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .sidebar-header h1 { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
        
        /* Arama Kutusu */
        .search-container {
            position: relative;
            flex: 1;
            max-width: 160px;
        }
        .search-input {
            width: 100%;
            background: rgba(20, 20, 22, 0.9);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 7px 12px 7px 30px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent-color);
            background: rgba(30, 30, 35, 0.95);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            pointer-events: none;
            color: var(--text-secondary);
        }
        .search-suggestions {
            display: none;
            position: absolute;
            top: 38px;
            left: 0;
            width: 100%;
            background: rgba(28, 28, 30, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 3000;
        }
        .search-suggestions.show { display: block; }
        .suggestion-item {
            padding: 9px 12px;
            font-size: 0.8rem;
            color: var(--text-primary);
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .suggestion-item:hover {
            background: rgba(245, 158, 11, 0.25);
            color: var(--accent-color);
        }

        .work-list { overflow-y: auto; flex: 1; padding: 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
        .work-list::-webkit-scrollbar { width: 6px; }
        .work-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Kartlar */
        .work-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .work-card:hover, .work-card.highlight { 
            background: var(--card-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.45);
            border-color: rgba(245, 158, 11, 0.6);
        }
        .work-card h3 { font-size: 1.05rem; color: #fff; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .work-card .author { font-size: 0.85rem; color: var(--accent-color); font-style: italic; margin-bottom: 8px; }
        .work-card .location { font-size: 0.75rem; color: var(--text-secondary); background: rgba(0,0,0,0.4); display: inline-block; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; border: 1px solid var(--border-glass); }
        .work-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 12px; margin: 6px 0 10px 0; display: block; border: 1px solid var(--border-glass); }
        .work-card p { font-size: 0.83rem; color: #d4d4d8; line-height: 1.5; border-top: 1px solid var(--border-glass); padding-top: 10px; }
        
        .active-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-color);
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            float: right;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-weight: 500;
        }

        /* Harita Alanı */
        #map { flex-grow: 1; height: 100%; width: 100%; background-color: #0b0b0d; position: relative; }

        /* Popup Tasarımı */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(28, 28, 30, 0.96) !important;
            backdrop-filter: blur(25px) !important;
            color: #fff !important;
            border-radius: 16px !important;
            border: 1px solid var(--border-glass);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7) !important;
        }
        .leaflet-popup-content { width: 260px !important; line-height: 1.5; }
        .leaflet-popup-content img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin: 8px 0; display: block; border: 1px solid var(--border-glass); }
        .leaflet-popup-content h4 { color: var(--accent-color); font-size: 0.95rem; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .leaflet-popup-content p { font-size: 0.8rem; color: #d4d4d8; font-style: italic; margin-top: 6px; }
        .leaflet-container a.leaflet-popup-close-button {
            background: rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 24px !important;
            height: 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            top: 12px !important;
            right: 12px !important;
            font-size: 14px !important;
        }
        .leaflet-container a.leaflet-popup-close-button:hover { background: rgba(245, 158, 11, 0.8) !important; }

        /* Sağ Üst Kontroller */
        .top-controls { position: absolute; top: 20px; right: 24px; z-index: 2000; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        
        .pill-btn { 
            background: rgba(28, 28, 30, 0.88); 
            backdrop-filter: blur(20px); 
            color: var(--text-primary); 
            border: 1px solid var(--border-glass); 
            padding: 8px 16px; 
            height: 42px; 
            border-radius: 21px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            transition: all 0.2s; 
        }
        .pill-btn:hover { transform: scale(1.04); background: rgba(58, 58, 60, 0.95); border-color: var(--accent-color); }
        
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 52px; 
            background: rgba(28, 28, 30, 0.96); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            width: 170px; 
            padding: 6px;
            z-index: 2500;
            max-height: 320px;
            overflow-y: auto;
        }
        .dropdown-menu.show { display: block; animation: fadeIn 0.2s ease; }

        /* İki Sütunlu Yazı Stili Menüsü */
        #font-style-menu {
            width: 320px;
            display: none;
            padding: 12px;
            gap: 10px;
        }
        #font-style-menu.show { display: flex !important; }
        .menu-column { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .menu-column-title {
            font-size: 0.72rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
            padding-left: 4px;
        }
        
        .dropdown-option { 
            padding: 8px 10px; 
            color: var(--text-primary); 
            background: none; 
            border: none; 
            width: 100%; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.83rem; 
            border-radius: 8px;
            transition: background 0.15s;
            font-weight: 500;
        }
        .dropdown-option:hover { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-color); }
        .dropdown-option.active { background-color: rgba(245, 158, 11, 0.3); color: var(--accent-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; min-width: 100%; height: 45vh; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Sağ Üst Kontroller -->
    <div class="top-controls">
        <!-- Yazı Stili Butonu -->
        <div style="position: relative;" id="font-container">
            <button class="pill-btn" onclick="toggleFontMenu()" id="font-style-btn">🔤 Yazı Stili</button>
            <div id="font-style-menu" class="dropdown-menu">
                <div class="menu-column">
                    <div class="menu-column-title" id="lbl-font">Yazı Tipi</div>
                    <button class="dropdown-option font-opt active" onclick="setFontFamily('default', this)">Varsayılan</button>
                    <button class="dropdown-option font-opt" onclick="setFontFamily('roboto', this)">Roboto</button>
                    <button class="dropdown-option font-opt" onclick="setFontFamily('playfair', this)">Playfair</button>
                </div>
                <div class="menu-column">
                    <div class="menu-column-title" id="lbl-weight">Kalınlık</div>
                    <button class="dropdown-option weight-opt active" onclick="setFontWeight('400', this)">Normal</button>
                    <button class="dropdown-option weight-opt" onclick="setFontWeight('700', this)">Kalın</button>
                </div>
            </div>
        </div>

        <!-- Harita Modu Butonu -->
        <div style="position: relative;" id="map-container">
            <button class="pill-btn" onclick="toggleMapMenu()" id="map-mode-btn">🗺️ Harita Modu</button>
            <div id="map-menu" class="dropdown-menu">
                <button class="dropdown-option" onclick="setMapStyle('standard')">🗺️ Standart Atlas</button>
                <button class="dropdown-option" onclick="setMapStyle('topo')">⛰️ Kabartılı Topo</button>
                <button class="dropdown-option" onclick="setMapStyle('satellite')">🛰️ Uydu Görünümü</button>
            </div>
        </div>

        <!-- Dil Seçici Butonu -->
        <div style="position: relative;" id="lang-container">
            <button class="pill-btn" onclick="toggleLangMenu()">🌐 Dil / Lang</button>
            <div id="lang-menu" class="dropdown-menu">
                <button class="dropdown-option" onclick="setLanguage('tr')">🇹🇷 Türkçe</button>
                <button class="dropdown-option" onclick="setLanguage('en')">🇬🇧 English</button>
                <button class="dropdown-option" onclick="setLanguage('fr')">🇫🇷 Français</button>
                <button class="dropdown-option" onclick="setLanguage('ar')">🇸🇦 العربية</button>
                <button class="dropdown-option" onclick="setLanguage('fa')">🇮🇷 فارسی</button>
                <button class="dropdown-option" onclick="setLanguage('zh')">🇨🇳 中文</button>
                <button class="dropdown-option" onclick="setLanguage('de')">🇩🇪 Deutsch</button>
                <button class="dropdown-option" onclick="setLanguage('el')">🇬🇷 Ελληνικά</button>
                <button class="dropdown-option" onclick="setLanguage('ja')">🇯🇵 日本語</button>
                <button class="dropdown-option" onclick="setLanguage('hi')">🇮🇳 हिन्दी</button>
            </div>
        </div>

        <!-- Sıfırlama Butonu -->
        <button class="pill-btn" onclick="resetMapToInitial()" title="İlk Konumlara Dön">🔄 Sıfırla</button>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1 id="ui-title">Klasik Edebiyat Rotaları</h1>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="workSearchInput" class="search-input" placeholder="Eser ara..." oninput="handleSearchInput(this.value)">
                <div id="searchSuggestions" class="search-suggestions"></div>
            </div>
        </div>
        <div class="work-list" id="workList"></div>
    </div>

    <!-- Harita Alanı -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

                    { step: 3, title: "Herat (Horasan)", lat: 34.3418, lng: 62.2027, quote: "Herat şehrinde ilim irfan meclislerinde bulunup Hüseyin Baykara'nın diyarını ziyaret ettik.", image: "https://images.unsplash.com/photo-1599839575945-a9e330adc30d?w=800" },
                    { step: 4, title: "Kazvin & Tahran (İran)", lat: 35.6892, lng: 51.3890, quote: "Şah Tahmasp'ın huzuruna varıp İran memleketinde ikram ve hürmet gördük.", image: "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?w=800" },
                    { step: 5, title: "İstanbul (Varış)", lat: 41.0082, lng: 28.9784, quote: "Nihayet aziz İstanbul'a, Kanuni Sultan Süleyman'ın huzuruna salimen ulaştık.", image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=800" }
                ]
            }
        ];

        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 4,
            maxZoom: 16
        }).setView([38.9637, 35.2433], 5);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const layers = {
            standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM' }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' })
        };

        let currentLayer = layers.standard.addTo(map);
        let activeMarkers = [];
        let activePolyline = null;
        let activeWorkId = null;

        // Menü Kontrolleri
        function toggleFontMenu() {
            document.getElementById('font-style-menu').classList.toggle('show');
            document.getElementById('map-menu').classList.remove('show');
            document.getElementById('lang-menu').classList.remove('show');
            document.getElementById('searchSuggestions').classList.remove('show');
        }

        function toggleMapMenu() {
            document.getElementById('map-menu').classList.toggle('show');
            document.getElementById('font-style-menu').classList.remove('show');
            document.getElementById('lang-menu').classList.remove('show');
            document.getElementById('searchSuggestions').classList.remove('show');
        }

        function toggleLangMenu() {
            document.getElementById('lang-menu').classList.toggle('show');
            document.getElementById('font-style-menu').classList.remove('show');
            document.getElementById('map-menu').classList.remove('show');
            document.getElementById('searchSuggestions').classList.remove('show');
        }

        window.addEventListener('click', function(e) {
            if (!document.getElementById('font-container').contains(e.target)) {
                document.getElementById('font-style-menu').classList.remove('show');
            }
            if (!document.getElementById('lang-container').contains(e.target)) {
                document.getElementById('lang-menu').classList.remove('show');
            }
            if (!document.getElementById('map-container').contains(e.target)) {
                document.getElementById('map-menu').classList.remove('show');
            }
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchSuggestions').classList.remove('show');
            }
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-menu').classList.remove('show');
            renderApp();
        }

        function setMapStyle(styleKey) {
            map.removeLayer(currentLayer);
            currentLayer = layers[styleKey].addTo(map);
            document.getElementById('map-menu').classList.remove('show');
        }

        function setFontFamily(fontKey, btnElement) {
            let fontValue = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            if (fontKey === 'roboto') fontValue = '"Roboto", sans-serif';
            if (fontKey === 'playfair') fontValue = '"Playfair Display", serif';

            document.documentElement.style.setProperty('--app-font', fontValue);
            document.querySelectorAll('.font-opt').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function setFontWeight(weightValue, btnElement) {
            document.documentElement.style.setProperty('--app-weight', weightValue);
            document.querySelectorAll('.weight-opt').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // Haritayı temizleme ve ilk konumlara döndürme
        function resetMapToInitial() {
            clearMapElements();
            activeWorkId = null;
            map.setView([38.9637, 35.2433], 5);
            renderApp();
        }

        function clearMapElements() {
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];
            if (activePolyline) {
                map.removeLayer(activePolyline);
                activePolyline = null;
            }
        }

        // Arama ve Anlık Tamamlama
        function handleSearchInput(query) {
            const suggestionsBox = document.getElementById('searchSuggestions');
            suggestionsBox.innerHTML = '';
            
            if (!query.trim()) {
                suggestionsBox.classList.remove('show');
                return;
            }

            const lowerQuery = query.toLowerCase();
            const matches = classicalWorks.filter(item => 
                item.title.toLowerCase().includes(lowerQuery) || item.author.toLowerCase().includes(lowerQuery)
            );

            if (matches.length > 0) {
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = `${item.title} (${item.author})`;
                    div.onclick = function() {
                        selectWorkJourney(item.id);
                        document.getElementById('workSearchInput').value = item.title;
                        suggestionsBox.classList.remove('show');
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.classList.add('show');
            } else {
                suggestionsBox.classList.remove('show');
            }
        }

        // Bir esere tıklandığında kronolojik yolculuk pimlerini ve iplerini göster
        function selectWorkJourney(workId) {
            clearMapElements();
            activeWorkId = workId;
            renderApp();

            const work = classicalWorks.find(w => w.id === workId);
            if (!work) return;

            let latLngs = [];
            let boundsPoints = [];

            work.journey.forEach((stop, index) => {
                const point = [stop.lat, stop.lng];
                latLngs.push(point);
                boundsPoints.push(point);

                const numberedIcon = L.divIcon({
                    className: 'custom-numbered-pin',
                    html: `<div style="background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(10px); border: 2px solid #f59e0b; color: #f59e0b; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6);">${stop.step}</div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18],
                    popupAnchor: [0, -20]
                });

                const marker = L.marker(point, { icon: numberedIcon }).addTo(map);
                marker.bindPopup(`
                    <h4>Pim ${stop.step}: ${stop.title}</h4>
                    <em>${work.title} (${work.author})</em>
                    <img src="${stop.image}" alt="${stop.title}">
                    <p>"${stop.quote}"</p>
                `);

                activeMarkers.push(marker);
            });

            activePolyline = L.polyline(latLngs, {
                color: '#f59e0b',
                weight: 3.5,
                opacity: 0.85,
                dashArray: '6, 8',
                lineCap: 'round'
            }).addTo(map);

            if (boundsPoints.length > 0) {
                map.fitBounds(L.latLngBounds(boundsPoints), { padding: [60, 60], maxZoom: 9, animate: true });
            }
        }

        // Ana Uygulama Çizimi
        function renderApp() {
            document.getElementById('ui-title').innerText = uiTexts[currentLang].title;
            document.getElementById('font-style-btn').innerText = uiTexts[currentLang].fontStyle;
            document.getElementById('map-mode-btn').innerText = uiTexts[currentLang].mapMode;
            document.getElementById('lbl-font').innerText = uiTexts[currentLang].fontTitle;
            document.getElementById('lbl-weight').innerText = uiTexts[currentLang].weightTitle;
            document.getElementById('workSearchInput').placeholder = uiTexts[currentLang].searchPlaceholder;

            const workListContainer = document.getElementById('workList');
            workListContainer.innerHTML = '';

            classicalWorks.forEach(function(item) {
                const card = document.createElement('div');
                card.className = `work-card ${activeWorkId === item.id ? 'highlight' : ''}`;
                
                let activeBadgeHtml = activeWorkId === item.id ? '<span class="active-badge">Rotada Aktif</span>' : '';

                card.innerHTML = `
                    ${activeBadgeHtml}
                    <h3>${item.title}</h3>
                    <div class="author">${item.author}</div>
                    <div class="location">📌 ${item.initialLocation}</div>
                    <img src="${item.image}" alt="${item.title}">
                    <p>${item.description}</p>
                `;

                card.addEventListener('click', function() {
                    selectWorkJourney(item.id);
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                workListContainer.appendChild(card);
            });

            if (!activeWorkId && activeMarkers.length === 0) {
                classicalWorks.forEach(function(item) {
                    const initialIcon = L.divIcon({
                        className: 'custom-initial-pin',
                        html: `<div style="background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(10px); border: 2px solid #a1a1aa; color: #fff; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">🏛️</div>`,
                        iconSize: [40, 40],
                        iconAnchor: [20, 20],
                        popupAnchor: [0, -22]
                    });

                    const marker = L.marker([item.lat, item.lng], { icon: initialIcon }).addTo(map);
                    marker.bindPopup(`
                        <h4>${item.title}</h4>
                        <em>Yazar: ${item.author}</em>
                        <img src="${item.image}" alt="${item.title}">
                        <p><strong>Merkez:</strong> ${item.initialLocation}</p>
                    `);

                    marker.on('click', function() {
                        selectWorkJourney(item.id);
                    });

                    activeMarkers.push(marker);
                });
            }
        }

        renderApp();
    </script>
</body>
</html>
